{{ define "main" }}
<section class="hero">
  <p class="hero-kicker">佛法文库</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ "volume-01/" | relURL }}">从第一册开始</a>
    <a class="btn" href="#latest">最近更新</a>
  </div>
</section>

<section class="sections" aria-labelledby="sections-title">
  <div class="section-head">
    <h2 id="sections-title">版块</h2>
    <p></p>
  </div>
  <div class="section-grid">
    {{ range site.Sections.ByWeight }}
      {{ if ne .Section "guanyu" }}
      <a class="section-card" href="{{ .RelPermalink }}">
        <span class="section-index">{{ printf "%02d" .Weight }}</span>
        <h3>{{ .Title }}</h3>
        <p>{{ .Description | default (.Summary | plainify) | truncate 80 }}</p>
        <span class="section-count">{{ len .RegularPages }} 篇</span>
      </a>
      {{ end }}
    {{ end }}
  </div>
</section>
{{ end }}
