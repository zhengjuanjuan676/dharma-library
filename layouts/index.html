{{ define "main" }}
<section class="sections" aria-labelledby="sections-title">
 
  <div class="section-grid">
    {{ range site.Sections.ByWeight }}
      {{ if ne .Section "guanyu" }}
      <a class="section-card" href="{{ .RelPermalink }}">
        <span class="section-index">{{ printf "%02d" .Weight }}</span>
        <h3>{{ .Title }}</h3>
        <p>{{ .Description | default (.Summary | plainify) | truncate 80 }}</p>
        <span class="section-count">{{ len .RegularPagesRecursive }} 篇</span>
      </a>
      {{ end }}
    {{ end }}
  </div>
</section>
{{ end }}
